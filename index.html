
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indonesia Virtual World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}
#game{width:100vw;height:100vh;display:block}
#info{position:fixed;top:12px;left:12px;color:white;background:#102b3dcc;padding:12px 16px;border-radius:12px;font-size:14px}
#controls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,58px);gap:7px}
button{border:0;border-radius:13px;background:#ffffffbb;color:#123;font-size:24px;font-weight:bold;width:58px;height:54px;touch-action:none}
#up{grid-column:2}
#left{grid-column:1}
#down{grid-column:2}
#right{grid-column:3}
</style>
</head>
<body>
<div id="info">🇮🇩 INDONESIA VIRTUAL WORLD<br>Provinsi: Jakarta<br>Status: Dunia awal</div>
<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 100);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x668855,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,30,10);
sun.castShadow=true;
scene.add(sun);

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x65a85b})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function building(x,z,w,h,d,color){
 const group=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 body.position.y=h/2;
 body.castShadow=true;
 group.add(body);
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(Math.max(w,d)*0.8,1.5,4),
  new THREE.MeshStandardMaterial({color:0x914b35})
 );
 roof.position.y=h+0.75;
 roof.rotation.y=Math.PI/4;
 group.add(roof);
 group.position.set(x,0,z);
 scene.add(group);
}

function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,2,7),
  new THREE.MeshStandardMaterial({color:0x79502d})
 );
 trunk.position.set(x,1,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.25,8,7),
  new THREE.MeshStandardMaterial({color:0x247b37})
 );
 leaves.position.set(x,2.5,z);
 scene.add(leaves);
}

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,100),
 new THREE.MeshStandardMaterial({color:0x44484b})
);
road.rotation.x=-Math.PI/2;
road.position.y=.025;
scene.add(road);

for(let z=-45;z<50;z+=12){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,5),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(0,.04,z);
 scene.add(line);
}

building(-10,-8,6,5,6,0xf0d4a3);
building(10,-12,7,6,7,0xe7e7e7);
building(-11,12,7,4,7,0xd9b38c);
building(11,12,8,7,7,0xe9d7bd);
building(-10,30,7,5,7,0xffffff);
building(10,30,7,5,7,0xf2d6a4);

for(let i=0;i<35;i++){
 const x=(Math.random()-.5)*65;
 const z=(Math.random()-.5)*90;
 if(Math.abs(x)>8) tree(x,z);
}

const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.45,.9,4,8),
 new THREE.MeshStandardMaterial({color:0x1769db})
);
body.position.y=1;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.35,16,16),
 new THREE.MeshStandardMaterial({color:0xffc99b})
);
head.position.y=1.85;
player.add(head);
player.position.set(0,0,8);
scene.add(player);

camera.position.set(0,6,15);
camera.lookAt(player.position);

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const directions={up:'w',down:'s',left:'a',right:'d'};
for(const [id,key] of Object.entries(directions)){
 const button=document.getElementById(id);
 button.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
 button.addEventListener('pointerup',()=>keys[key]=false);
 button.addEventListener('pointerleave',()=>keys[key]=false);
 button.addEventListener('pointercancel',()=>keys[key]=false);
}

function animate(){
 requestAnimationFrame(animate);
 const speed=.12;
 if(keys.w||keys.arrowup) player.position.z-=speed;
 if(keys.s||keys.arrowdown) player.position.z+=speed;
 if(keys.a||keys.arrowleft) player.position.x-=speed;
 if(keys.d||keys.arrowright) player.position.x+=speed;

 player.position.x=Math.max(-35,Math.min(35,player.position.x));
 player.position.z=Math.max(-45,Math.min(45,player.position.z));

 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+5,
  player.position.z+9
 );
 camera.position.lerp(target,.08);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
